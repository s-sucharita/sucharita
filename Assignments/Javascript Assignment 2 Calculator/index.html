<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="calculator">
      <h2><i>Simple Calculator</i></h2>

      <input type="number" id="number1" placeholder="Enter the first number" />
      <br /><br />
      <input type="number" id="number2" placeholder="Enter the second number" />
      <br /><br />

      <div class="buttons">
        <button onclick="calc('add')">+</button>
        <button onclick="calc('subtract')">−</button>
        <button onclick="calc('multiply')">×</button>
        <button onclick="calc('divide')">÷</button>
        <button onclick="calc('square')">x²</button>
        <button onclick="calc('cube')">x³</button>
        <button onclick="clearValues()">C</button>
      </div>

      <div id="result">Result : </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
