<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="style.css"/>
</head>
<body>
      <div class="container">
        <h1>Phonebook</h1>

        <!-- Adding Contacts -->
        <div>
            <input type="text" id="nameInput" placeholder="Enter the name"/>
            <input type="text" id="phoneInput" placeholder="Enter the phone number"/>
            <button id="addContactBtn">Add Contact</button>
        </div>

        <!-- Searching -->
        <div>
            <input type="text" id="searchInput" placeholder="Search by name or number"/>
        </div>

        <!-- Viewing Contact List -->
        <ul id="contactList"></ul>
    </div>

    <script src="app.js"></script>
    
</body>
</html>
